# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: devops-ingress
# spec:
#   ingressClassName: nginx
#   rules:
#     - host: devops.local
#       http:
#         paths:
#           # 🔥 backend FIRST
#           - path: /health
#             pathType: Prefix
#             backend:
#               service:
#                 name: backend-service
#                 port:
#                   number: 8000

#           - path: /db-check
#             pathType: Prefix
#             backend:
#               service:
#                 name: backend-service
#                 port:
#                   number: 8000

#           # 🔥 frontend LAST
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: frontend-service
#                 port:
#                   number: 3000
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: devops.local
      http:
        paths:
          # 🔥 Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          # 🔥 Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
