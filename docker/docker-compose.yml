version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend_v1:
    build:
      context: ../services/backend-fastapi
    image: backend:v1
    container_name: backend_v1
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

  backend_v2:
    build:
      context: ../services/backend-fastapi
    image: backend:v2
    container_name: backend_v2
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend_v1:
    build:
      context: ../services/frontend-react
    image: frontend:v1
    container_name: frontend_v1
    restart: always
    depends_on:
      - backend_v1

  frontend_v2:
    build:
      context: ../services/frontend-react
    image: frontend:v2
    container_name: frontend_v2
    restart: always
    depends_on:
      - backend_v2
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80" ]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend_v1
      - frontend_v2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
