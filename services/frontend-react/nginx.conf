server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for Kubernetes probes
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
