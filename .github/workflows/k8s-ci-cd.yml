name: Kubernetes CI/CD Pipeline

on:
 push:
  branches:
  - main

jobs:
 build-and-deploy:
  runs-on: ubuntu-latest

  steps:
  # Checkout code
  - name: Checkout code
    uses: actions/checkout@v3

  # Login Docker Hub
  - name: Login to Docker Hub
    uses: docker/login-action@v2
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  # Build & Push Backend
  - name: Build & Push Backend
    run: |
      docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v5 ./services/backend-fastapi
      docker push ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v5

  # Build & Push Frontend
  - name: Build & Push Frontend
    run: |
      docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:v5 ./services/frontend-react
      docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:v5

  # Deploy to EC2
  - name: Deploy to EC2
    uses: appleboy/ssh-action@v0.1.6
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd ~/test-deploy/autonomous-devops-platform/kubernetes
        git pull
        sudo kubectl apply -f .
        sudo kubectl rollout restart deployment backend
        sudo kubectl rollout restart deployment frontend