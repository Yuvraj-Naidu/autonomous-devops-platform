name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Print TAG
        run: echo "Deploying version ${{ env.TAG }}"

      - name: Build & Push Backend
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:${{ env.TAG }} ./services/backend-fastapi
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:${{ env.TAG }}

      - name: Build & Push Frontend
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:${{ env.TAG }} ./services/frontend-react
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:${{ env.TAG }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/test-deploy/autonomous-devops-platform/kubernetes
            git pull

            sudo kubectl apply -f .

            sudo kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/backend-fastapi:${{ env.TAG }}
            sudo kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend-react:${{ env.TAG }}

            sudo kubectl rollout status deployment/backend
            sudo kubectl rollout status deployment/frontend
