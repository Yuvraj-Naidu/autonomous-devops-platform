name: Kubernetes CI/CD Pipeline

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            # -----------------------------
            # Checkout Code
            # -----------------------------
            - name: Checkout code
              uses: actions/checkout@v3

            # -----------------------------
            # Login to Docker Hub
            # -----------------------------
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # -----------------------------
            # Build Backend Image
            # -----------------------------
            - name: Build Backend Image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v5 ./services/backend-fastapi

            # -----------------------------
            # Build Frontend Image
            # -----------------------------
            - name: Build Frontend Image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:v5 ./services/frontend-react

            # -----------------------------
            # Push Backend Image
            # -----------------------------
            - name: Push Backend Image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v5

            # -----------------------------
            # Push Frontend Image
            # -----------------------------
            - name: Push Frontend Image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:v5

            # -----------------------------
            # Setup Kubeconfig
            # -----------------------------
            - name: Set kubeconfig
              run: |
                  echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
                  chmod 600 kubeconfig

            # -----------------------------
            # Deploy (Rolling Update)
            # -----------------------------
            - name: Update Backend
              run: |
                  export KUBECONFIG=$PWD/kubeconfig
                  kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v5

            - name: Update Frontend
              run: |
                  export KUBECONFIG=$PWD/kubeconfig
                  kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend-react:v5

            # -----------------------------
            # Verify Rollout
            # -----------------------------
            - name: Verify Rollout
              run: |
                  export KUBECONFIG=$PWD/kubeconfig
                  kubectl rollout status deployment/backend
                  kubectl rollout status deployment/frontend

            # -----------------------------
            # Health Check (Optional)
            # -----------------------------
            - name: Health Check
              run: |
                  sleep 10
                  curl -f http://devops.local/api/health || exit 1
