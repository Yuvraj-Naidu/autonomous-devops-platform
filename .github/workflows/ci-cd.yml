name: Kubernetes CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{
          secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v4
          ./services/backend-fastapi

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:v4
          ./services/frontend-react

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v4

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:v4

      # 🔑 Setup kubeconfig
      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      # 🚀 Deploy (rolling update)
      - name: Update Backend
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v4

      - name: Update Frontend
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend-react:v4

      # ⏳ Wait for rollout
      - name: Verify rollout
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend

      # 🧪 Health check
      - name: Health Check
        run: |
          sleep 10
          curl -f http://devops.local/api/health

