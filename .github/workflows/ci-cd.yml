name: DevOps Platform CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v2 ./services/backend-fastapi

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:v2 ./services/frontend-react

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v2

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:v2


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Pulling V2 images..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v2
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-react:v2

            echo "🧹 Cleaning old V2..."

            docker rm -f backend_v2 || true
            docker rm -f frontend_v2 || true

            echo "🟢 Starting Backend V2..."

            docker run -d -p 8001:8000 --name backend_v2 \
              ${{ secrets.DOCKER_USERNAME }}/backend-fastapi:v2

            sleep 5

            docker ps | grep backend_v2 || (echo "❌ Backend V2 failed" && exit 1)

            echo "🟢 Starting Frontend V2..."

            docker run -d -p 3001:3000 --name frontend_v2 \
              ${{ secrets.DOCKER_USERNAME }}/frontend-react:v2

            sleep 5

            docker ps | grep frontend_v2 || (echo "❌ Frontend V2 failed" && exit 1)

            echo "✅ V2 deployed successfully (V1 still running)"